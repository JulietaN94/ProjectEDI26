name: Lavadero Deploy Azure

on:
  push:
    branches:
      - develop
    paths:
      - "Lavadero/**"
      - ".github/workflows/lavadero-azure.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lavadero-azure-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "8.0.x"
  WEB_PROJECT: "Lavadero/Lavadero.Web/Lavadero.Web.csproj"
  TEST_PROJECT: "Lavadero/Lavadero.Tests/Lavadero.Tests.csproj"

jobs:
  build-and-deploy:
    name: Build and deploy to Azure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: |
          dotnet restore "${{ env.WEB_PROJECT }}"
          dotnet restore "${{ env.TEST_PROJECT }}"

      - name: Build
        run: |
          dotnet build "${{ env.WEB_PROJECT }}" --configuration Release --no-restore
          dotnet build "${{ env.TEST_PROJECT }}" --configuration Release --no-restore

      - name: Test
        run: dotnet test "${{ env.TEST_PROJECT }}" --configuration Release --no-build

      - name: Publish
        run: dotnet publish "${{ env.WEB_PROJECT }}" --configuration Release --no-restore --output "${{ github.workspace }}/publish"

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: lavadero-edi26-2026
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: "${{ github.workspace }}/publish"
